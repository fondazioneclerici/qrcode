<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============ MODIFICA QUI ============ -->
<title>Coming Soon</title>
<meta name="description" content="Qualcosa sta arrivando.">
<!-- ====================================== -->

<style>
  :root {
    --bg:        #101319;
    --surface:   #171b23;
    --line:      #262c38;
    --text:      #ece9e1;
    --muted:     #7b828f;
    --accent:    #d9a441;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto;
    -webkit-font-smoothing: antialiased;
  }

  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: clamp(1.5rem, 5vw, 4rem);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    font-size: .8rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-bottom: 2.25rem;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70%  { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  h1 {
    font-size: clamp(2.4rem, 8vw, 4.5rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.02;
    margin-bottom: 1rem;
  }

  .lead {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    color: var(--muted);
    max-width: 46ch;
    margin-bottom: 3rem;
  }

  .countdown {
    display: flex;
    gap: clamp(1rem, 4vw, 2.5rem);
    border-top: 1px solid var(--line);
    padding-top: 1.75rem;
    width: 100%;
  }
  .unit { display: flex; flex-direction: column; }
  .unit .num {
    font-size: clamp(1.8rem, 6vw, 3rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .unit .label {
    font-size: .75rem;
    color: var(--muted);
    margin-top: .5rem;
  }

  form.notify {
    display: flex;
    gap: .5rem;
    margin-top: 2.5rem;
    width: 100%;
    max-width: 420px;
    flex-wrap: wrap;
  }
  input[type="email"] {
    flex: 1 1 200px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: .75rem 1rem;
    font: inherit;
  }
  input[type="email"]::placeholder { color: var(--muted); }
  button {
    background: var(--accent);
    color: #1a1408;
    border: none;
    border-radius: 8px;
    padding: .75rem 1.4rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s ease;
  }
  button:hover { filter: brightness(1.08); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  footer {
    padding: 1.5rem clamp(1.5rem, 5vw, 4rem);
    font-size: .8rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
  footer a { color: var(--text); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }
</style>
</head>
<body>

  <main>
    <span class="status"><span class="dot"></span> In lavorazione</span>

    <!-- ============ MODIFICA QUI ============ -->
    <h1>Presto online.</h1>
    <p class="lead">Sto costruendo qualcosa. Torna a trovarmi a breve.</p>
    <!-- ====================================== -->

    <div class="countdown" id="countdown" aria-live="polite">
      <div class="unit"><span class="num" id="d">--</span><span class="label">Giorni</span></div>
      <div class="unit"><span class="num" id="h">--</span><span class="label">Ore</span></div>
      <div class="unit"><span class="num" id="m">--</span><span class="label">Minuti</span></div>
      <div class="unit"><span class="num" id="s">--</span><span class="label">Secondi</span></div>
    </div>

    <!-- Rimuovi questo form se non ti serve la raccolta email -->
    <form class="notify" onsubmit="return false;">
      <input type="email" placeholder="La tua email" aria-label="Email">
      <button type="submit">Avvisami</button>
    </form>
  </main>

  <footer>
    &copy; <span id="year"></span> — <a href="#">Nome / Progetto</a>
  </footer>

<script>
  /* ============ MODIFICA QUI ============ */
  // Data di lancio: anno, mese (0 = gennaio!), giorno, ora, minuti
  const LAUNCH = new Date(2026, 11, 1, 10, 0);
  /* ====================================== */

  const $ = id => document.getElementById(id);
  $("year").textContent = new Date().getFullYear();

  function tick() {
    const diff = LAUNCH - new Date();
    if (diff <= 0) {
      $("countdown").innerHTML = '<div class="unit"><span class="num">È online.</span></div>';
      clearInterval(timer);
      return;
    }
    const s = Math.floor(diff / 1000);
    $("d").textContent = Math.floor(s / 86400);
    $("h").textContent = String(Math.floor(s % 86400 / 3600)).padStart(2, "0");
    $("m").textContent = String(Math.floor(s % 3600 / 60)).padStart(2, "0");
    $("s").textContent = String(s % 60).padStart(2, "0");
  }
  tick();
  const timer = setInterval(tick, 1000);
</script>
</body>
</html>
